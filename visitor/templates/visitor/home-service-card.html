{% load static %}
<article class="service-card">
    <span class="service-card__icon"><img src="{% static 'visitor/img/icons/'|add:service.icon %}" alt="" width="30" height="30"></span>
    <h3 class="service-card__name">{{ service.name }}</h3>
    <p class="service-card__description">{{ service.description }}</p>
    <ul class="service-card__points">
        {% for point in service.points %}
            <li><span class="service-card__check"><img src="{% static 'visitor/img/icons/check.svg' %}" alt="" width="14" height="14"></span>{{ point }}</li>
        {% endfor %}
    </ul>
</article>
